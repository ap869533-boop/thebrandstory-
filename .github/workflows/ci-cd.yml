name: 🚀 CI/CD Pipeline (thebrandsstory.)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Prevent concurrent deployment runs on main branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend CI: Typecheck & Build
  # ============================================================================
  ci-backend:
    name: 🧪 Backend CI (TypeCheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        run: npm install

      - name: 🔍 TypeScript Type Check
        run: npm run lint

      - name: ⚙️ Build Backend (TypeScript to JS)
        run: npm run build

  # ============================================================================
  # 2. Frontend CI: Typecheck & Production Bundle Build
  # ============================================================================
  ci-frontend:
    name: 🎨 Frontend CI (TypeCheck & Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm install

      - name: 🔍 TypeScript Type Check
        run: npm run lint

      - name: 🏗️ Build Frontend Production Bundle (Vite)
        run: npm run build

  # ============================================================================
  # 3. Continuous Deployment (VPS Deployment via SSH)
  # Only executes on 'main' branch when all CI tests pass
  # ============================================================================
  deploy:
    name: 🚀 Deploy to VPS (Zero-Downtime)
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          script_stop: true
          command_timeout: 15m
          script: |
            TARGET_DIR="${{ secrets.VPS_TARGET_DIR || '/var/www/thebrandsstory' }}"
            echo "Target deployment directory: $TARGET_DIR"
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Error: Target directory $TARGET_DIR does not exist on VPS!"
              echo "Please follow VPS_DEPLOYMENT_GUIDE.md to clone the repository first."
              exit 1
            fi
            
            cd "$TARGET_DIR"
            
            # Fetch latest git commits
            git fetch origin main
            git reset --hard origin/main
            
            # Ensure deploy script is executable
            chmod +x scripts/deploy.sh
            
            # Execute automated zero-downtime deployment script
            bash scripts/deploy.sh "$TARGET_DIR"
