<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B242" />
      <stop offset="100%" stop-color="#B88628" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g transform="translate(10, 5)">
    <!-- Icon badge -->
    <rect x="0" y="8" width="44" height="44" rx="12" fill="url(#goldGrad)" />
    <path d="M14 30 L22 38 L30 22" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="30" cy="18" r="3" fill="#000000" />
    
    <!-- Text -->
    <text x="56" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="400" fill="#0f172a" letter-spacing="-1">the</text>
    <text x="106" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" letter-spacing="-1">brands</text>
    <text x="212" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="400" fill="#0f172a" letter-spacing="-1">story</text>
    <text x="286" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)">.</text>
